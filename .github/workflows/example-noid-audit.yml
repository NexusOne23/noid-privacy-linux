name: Hardening Posture Audit

on:
  # Run on demand
  workflow_dispatch:
  # Run on PRs that touch security-relevant files
  pull_request:
    paths:
      - '*.sh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  audit:
    name: NoID Privacy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pin to specific version (or full commit SHA for max supply-chain safety).
        # `@v7` floats to the v7 series; `@v7.0.1` pins a release tag;
        # `@<full-sha>` pins a specific commit. Production workflows should pin
        # tightly.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run NoID Privacy Audit
        id: audit
        # Release snapshot: replace the v3.7.2 tag below with the immutable
        # commit recorded on the release page in production workflows.
        # See https://docs.github.com/en/actions/security-guides for guidance.
        uses: NexusOne23/noid-privacy-linux@v3.7.2
        with:
          min-score: '70'      # posture within the assessed scope
          min-coverage: '75'   # fixed risk weight with assessed evidence
          # ai: 'true'        # Uncomment to generate AI remediation prompt
          # skip: 'rootkit,containers'  # Uncomment to skip sections

      - name: Print Score
        run: |
          echo "Desktop posture score: ${{ steps.audit.outputs.score }}%"
          echo "Assessed risk-weight coverage: ${{ steps.audit.outputs.score_coverage }}%"
